description = "Desktop control panel for Coding Tools MCP"
authors = ["Coding Tools MCP Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
